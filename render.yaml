services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  - type: web
    name: swing-scanner-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health

  # ── Frontend (Next.js) ─────────────────────────────────────────
  - type: web
    name: swing-scanner-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          name: swing-scanner-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: "3000"
